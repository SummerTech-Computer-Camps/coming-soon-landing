<style id="summertech-slider-style-inline-css">
.block-slider {
  --slider-height: clamp(180px, 50vw, 300px);
  --slider-gap: 0px;
  --slider-duration: 120s;
  padding: 0 !important;
}
.block-slider .slider-marquee {
  overflow: hidden;
  pointer-events: none;
  width: 100%;
}
.block-slider .slider-track {
  animation: slider-marquee var(--slider-duration) linear infinite;
  display: flex;
  width: max-content;
  will-change: transform;
}
.block-slider .slider-set {
  align-items: stretch;
  display: flex;
  flex-shrink: 0;
  gap: var(--slider-gap);
}
.block-slider .slider-slide {
  flex-shrink: 0;
}
.block-slider img {
  display: block;
  height: var(--slider-height);
  width: auto;
}
@media (prefers-reduced-motion: reduce) {
  .block-slider .slider-track {
    animation: none;
  }
}

@keyframes slider-marquee {
  from {
    transform: translate3d(0, 0, 0);
  }
  to {
    transform: translate3d(-50%, 0, 0);
  }
}
/* Editor Styles */
.acf-block-body.acf-block-preview.wp-block-summertech-slider .block-slider .slider-marquee {
  overflow-x: scroll;
  overflow-y: hidden;
}
.acf-block-body.acf-block-preview.wp-block-summertech-slider .block-slider .slider-track {
  animation: none;
  width: max-content;
}
.acf-block-body.acf-block-preview.wp-block-summertech-slider .block-slider .slider-set {
  display: flex;
  gap: var(--slider-gap);
}
.acf-block-body.acf-block-preview.wp-block-summertech-slider .block-slider .slider-set + .slider-set {
  display: none;
}
.acf-block-body.acf-block-preview.wp-block-summertech-slider .block-slider .slider-slide img {
  display: block;
  height: var(--slider-height);
  width: auto;
}

<script>
// Set the date we're counting down to
var countDownDate = new Date("Nov 15, 2026 8:00:00").getTime();

// Update the count down every 1 second
var x = setInterval(function() {

  // Get today's date and time
  var now = new Date().getTime();
    
  // Find the distance between now and the count down date
  var distance = countDownDate - now;
    
  // Time calculations for days, hours, minutes and seconds
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
  // Output the result in an element with id="demo"
  document.getElementById("demo").innerHTML = days + " days " + hours + " hours "
  + minutes + " minutes " + seconds + " seconds";
    
  // If the count down is over, write some text 
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = "SOON";
  }
}, 1000);
</script>
